
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b1c">
  <title>SOTF Ticket Scanner</title>

  <style>
    :root {
      --bg: #101b1c;
      --panel: #192627;
      --gold: #e6c779;
      --text: #f7f4eb;
      --muted: #aebbb8;
      --border: #354344;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #263b35 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .scanner {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(25, 38, 39, 0.96);
      box-shadow: 0 20px 60px #0005;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 30px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--border);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #465657;
      border-radius: 10px;
      outline: none;
      background: #101b1c;
      color: var(--text);
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #e6c77920;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #17201c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .result-icon {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .result-title {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="scanner">
    <header class="brand">
      <div class="logo" aria-hidden="true">✦</div>
      <div class="eyebrow">OFFICIAL SCREENING</div>
      <h1>Song of the Fireflies</h1>
      <p class="subtitle">Ticket Verification &amp; Check-in</p>
    </header>

    <div class="divider"></div>

    <form id="ticketForm">
      <label for="ticketId">Ticket ID</label>
      <input
        id="ticketId"
        name="ticketId"
        type="text"
        placeholder="Enter or scan ticket ID"
        autocomplete="off"
        required
      >

      <button id="verifyButton" type="submit">
        VERIFY TICKET
      </button>
    </form>

    <section
      id="result"
      class="result hidden"
      aria-live="polite"
    >
      <div class="result-icon" id="resultIcon">ℹ</div>
      <div class="result-title" id="resultTitle">
        NOT CONNECTED
      </div>
      <div class="result-message" id="resultMessage"></div>
    </section>

    <footer class="footer">
      Authorized screening staff only<br>
      Song of the Fireflies · Official Ticket Validator
    </footer>
  </main>

  <script>
    const form = document.getElementById("ticketForm");
    const ticketInput = document.getElementById("ticketId");
    const result = document.getElementById("result");
    const resultIcon = document.getElementById("resultIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");

    function showResult(title, message, icon = "ℹ") {
      result.classList.remove("hidden");
      resultIcon.textContent = icon;
      resultTitle.textContent = title;
      resultMessage.textContent = message;
    }

    // Allow a ticket ID to be passed in the URL:
    // scanner.html?ticket=SOTF-EXAMPLE-T01
    const params = new URLSearchParams(window.location.search);
    const ticketFromUrl = params.get("ticket");

    if (ticketFromUrl) {
      ticketInput.value = ticketFromUrl.trim();
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const ticketId = ticketInput.value.trim();

      if (!ticketId) {
        showResult("TICKET ID REQUIRED",
          "Enter a ticket ID to continue.", "!");
        return;
      }

      // Backend integration will be added next.
      // Never mark a ticket valid on the frontend alone.
      showResult(
        "BACKEND NOT CONNECTED",
        "Ticket " + ticketId +
        " has not been verified. Connect the Google Apps Script backend to check ticket validity.",
        "ℹ"
      );
    });
  </script>
</body>
</html>
