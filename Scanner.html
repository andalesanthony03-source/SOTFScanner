
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOTF Ticket Scanner</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #101b1c;
      --panel: #192627;
      --gold: #e6c779;
      --text: #f7f4eb;
      --muted: #aebbb8;
      --border: #354344;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #263b35 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .scanner {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(25, 38, 39, 0.96);
      box-shadow: 0 20px 60px #0005;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 30px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--border);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #465657;
      border-radius: 10px;
      outline: none;
      background: #101b1c;
      color: var(--text);
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #e6c77920;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #17201c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #101b1c;
    }

    #reader video {
      border-radius: 10px;
    }

    .camera-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .result-icon {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .result-title {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status-valid .result-title {
      color: #86efac;
    }

    .status-invalid .result-title,
    .status-used .result-title {
      color: #fca5a5;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="scanner">

    <header class="brand">
      <div class="logo">✦</div>
      <div class="eyebrow">SONG OF THE FIREFLIES</div>
      <h1>Ticket Scanner</h1>
      <p class="subtitle">
        Local demo · No Google Sheets or Apps Script connection
      </p>
    </header>

    <div class="divider"></div>

    <!-- Camera scanner -->
    <div id="reader" class="hidden"></div>

    <button id="startCamera" type="button">
      OPEN CAMERA
    </button>

    <button id="stopCamera" class="secondary hidden" type="button">
      STOP CAMERA
    </button>

    <p id="cameraNote" class="camera-note">
      Allow camera access when prompted. Camera access requires HTTPS or localhost.
    </p>

    <div class="divider"></div>

    <!-- Manual testing -->
    <label for="ticketInput">
      Or enter a ticket ID / paste QR content
    </label>

    <input
      id="ticketInput"
      type="text"
      placeholder="SOTF-TEST001-T01"
      autocomplete="off"
    >

    <button id="verifyButton" type="button">
      VERIFY TICKET
    </button>

    <button id="checkInButton" class="hidden" type="button">
      CHECK IN
    </button>

    <!-- Result -->
    <section id="result" class="result hidden" aria-live="polite">
      <div id="resultIcon" class="result-icon">ℹ</div>
      <div id="resultTitle" class="result-title">READY</div>
      <div id="resultMessage" class="result-message"></div>
    </section>

    <footer class="footer">
      LOCAL TEST MODE<br>
      Sample tickets only. Nothing is saved to your spreadsheet.
    </footer>

  </main>

  <script>
    // ==========================================
    // SAMPLE DATA — LOCAL TESTING ONLY
    // ==========================================

    const tickets = {
      "SOTF-TEST001-T01": {
        guest: "Test Guest",
        status: "Unused"
      },

      "SOTF-TEST002-T01": {
        guest: "Second Test Guest",
        status: "Unused"
      }
    };

    const ticketInput = document.getElementById("ticketInput");
    const verifyButton = document.getElementById("verifyButton");
    const checkInButton = document.getElementById("checkInButton");
    const startCameraButton = document.getElementById("startCamera");
    const stopCameraButton = document.getElementById("stopCamera");
    const reader = document.getElementById("reader");
    const result = document.getElementById("result");
    const resultIcon = document.getElementById("resultIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const cameraNote = document.getElementById("cameraNote");

    let currentTicketId = "";
    let qrScanner = null;
    let cameraRunning = false;
    let handlingScan = false;

    // ==========================================
    // READ TICKET ID FROM QR CONTENT
    // ==========================================

    function extractTicketId(rawText) {
      const value = String(rawText || "").trim();

      if (!value) return "";

      // Supports QR codes containing a URL such as:
      // https://example.com/?ticket=SOTF-TEST001-T01
      try {
        const url = new URL(value);
        const ticket = url.searchParams.get("ticket");

        if (ticket) {
          return ticket.trim();
        }
      } catch (error) {
        // The QR content may be a plain ticket ID.
      }

      // Supports plain ticket IDs or IDs inside longer text.
      const match = value.match(/SOTF-[A-Z0-9-]+/i);

      return match ? match[0].trim() : value;
    }

    // ==========================================
    // DISPLAY RESULT
    // ==========================================

    function showResult(type, title, message) {
      result.className = "result";

      if (type) {
        result.classList.add(type);
      }

      if (type === "status-valid") {
        resultIcon.textContent = "✓";
      } else if (
        type === "status-used" ||
        type === "status-invalid"
      ) {
        resultIcon.textContent = "⚠";
      } else {
        resultIcon.textContent = "ℹ";
      }

      resultTitle.textContent = title;
      resultMessage.textContent = message;
      result.classList.remove("hidden");
    }

    // ==========================================
    // VERIFY TICKET
    // ==========================================

    function verifyTicket(rawValue) {
      const id = extractTicketId(rawValue);

      ticketInput.value = id;
      currentTicketId = id;

      checkInButton.classList.add("hidden");

      if (!id) {
        showResult(
          "status-invalid",
          "NO TICKET ID",
          "Scan a QR code or enter a ticket ID first."
        );
        return;
      }

      const ticket = tickets[id];

      if (!ticket) {
        showResult(
          "status-invalid",
          "INVALID TICKET",
          "This ID is not in the local sample data: " + id
        );
        return;
      }

      if (ticket.status === "Used") {
        showResult(
          "status-used",
          "ALREADY USED — ENTRY DENIED",
          "This ticket has already been checked in. Guest: " +
            ticket.guest + " · Ticket: " + id
        );
        return;
      }

      showResult(
        "status-valid",
        "VALID TICKET",
        "Guest: " + ticket.guest +
          " · Ticket: " + id +
          ". Tap CHECK IN to mark this sample ticket as used."
      );

      checkInButton.classList.remove("hidden");
    }

    verifyButton.addEventListener("click", function () {
      verifyTicket(ticketInput.value);
    });

    ticketInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        verifyTicket(ticketInput.value);
      }
    });

    // ==========================================
    // LOCAL CHECK-IN
    // ==========================================

    checkInButton.addEventListener("click", function () {
      if (!currentTicketId || !tickets[currentTicketId]) {
        return;
      }

      const ticket = tickets[currentTicketId];

      if (ticket.status === "Used") {
        showResult(
          "status-used",
          "ALREADY USED — ENTRY DENIED",
          "This ticket has already been checked in."
        );

        checkInButton.classList.add("hidden");
        return;
      }

      ticket.status = "Used";

      checkInButton.classList.add("hidden");

      showResult(
        "status-valid",
        "CHECK-IN SUCCESSFUL!",
        "Guest: " + ticket.guest +
          " · Ticket: " + currentTicketId +
          ". This change exists only in this open page."
      );
    });

    // ==========================================
    // CAMERA QR SCANNER
    // ==========================================

    async function startCamera() {
      if (!window.Html5Qrcode) {
        cameraNote.textContent =
          "The QR scanner library did not load. Check your internet connection and reload.";
        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        cameraNote.textContent =
          "Camera access is unavailable here. Open this page using HTTPS or localhost.";
        return;
      }

      startCameraButton.disabled = true;
      cameraNote.textContent = "Requesting camera permission…";
      reader.classList.remove("hidden");

      try {
        if (!qrScanner) {
          qrScanner = new Html5Qrcode("reader");
        }

        await qrScanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 },
            aspectRatio: 1.0
          },

          async function (decodedText) {
            if (handlingScan) return;

            handlingScan = true;

            // Stop after one QR read to prevent repeated scans.
            await stopCamera();

            verifyTicket(decodedText);

            cameraNote.textContent =
              "QR code detected. Press OPEN CAMERA to scan another ticket.";

            handlingScan = false;
          },

          function () {
            // Ignore normal frames where no QR code is detected.
          }
        );

        cameraRunning = true;
        startCameraButton.classList.add("hidden");
        stopCameraButton.classList.remove("hidden");

        cameraNote.textContent =
          "Point the camera at the ticket QR code.";
      } catch (error) {
        reader.classList.add("hidden");
        startCameraButton.disabled = false;

        cameraNote.textContent =
          "Could not open the camera. Allow camera permission and use HTTPS or localhost. " +
          (error && error.message ? error.message : "");
      }
    }

    async function stopCamera() {
      if (qrScanner && cameraRunning) {
        try {
          await qrScanner.stop();
        } catch (error) {
          // Ignore camera stop errors.
        }

        cameraRunning = false;
      }

      startCameraButton.classList.remove("hidden");
      startCameraButton.disabled = false;
      stopCameraButton.classList.add("hidden");
      reader.classList.add("hidden");
    }

    startCameraButton.addEventListener("click", startCamera);
    stopCameraButton.addEventListener("click", stopCamera);
  </script>
</body>
</html>
