<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b1c">
  <title>SOTF Ticket Scanner</title>

  <style>
    :root {
      --bg: #101b1c;
      --panel: #192627;
      --gold: #e6c779;
      --text: #f7f4eb;
      --muted: #aebbb8;
      --border: #354344;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #263b35 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .scanner {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(25, 38, 39, 0.96);
      box-shadow: 0 20px 60px #0005;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 30px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--border);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #465657;
      border-radius: 10px;
      outline: none;
      background: #101b1c;
      color: var(--text);
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #e6c77920;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #17201c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .result-icon {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .result-title {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="scanner">
    <header class="brand">
      <div class="logo" aria-hidden="true">✦</div>
      <div class="eyebrow">OFFICIAL SCREENING</div>
      <h1>Song of the Fireflies</h1>
      <p class="subtitle">Ticket Verification &amp; Check-in</p>
    </header>

    <div class="divider"></div>

    <form id="ticketForm">
      <label for="ticketId">Ticket ID</label>
      <input
        id="ticketId"
        name="ticketId"
        type="text"
        placeholder="Enter or scan ticket ID"
        autocomplete="off"
        required
      >

      <button id="verifyButton" type="submit">
        VERIFY TICKET
      </button>
    </form>

    <section
      id="result"
      class="result hidden"
      aria-live="polite"
    >
      <div class="result-icon" id="resultIcon">ℹ</div>
      <div class="result-title" id="resultTitle">
        NOT CONNECTED
      </div>
      <div class="result-message" id="resultMessage"></div>
    </section>

    <footer class="footer">
      Authorized screening staff only<br>
      Song of the Fireflies · Official Ticket Validator
    </footer>
  </main>

<iframe
  id="sotfBridge"
  src="https://script.google.com/macros/s/AKfycbwghjiVJQgtgq2-lRcpShSEtWZXJQor5Rzh4wN_n3p7wPoDye5kmFBQvyyGZyGndu_H/exec?bridge=1"
  title="SOTF verification connection"
  style="display:none"
></iframe>
  
<script>
  const form = document.getElementById("ticketForm");
  const ticketInput = document.getElementById("ticketId");
  const result = document.getElementById("result");
  const resultIcon = document.getElementById("resultIcon");
  const resultTitle = document.getElementById("resultTitle");
  const resultMessage = document.getElementById("resultMessage");

  const bridge = document.getElementById("sotfBridge");
  const CHANNEL = "SOTF_SCANNER";

  let bridgeReady = false;
  let pendingRequest = null;
  let requestCounter = 0;
  let verifiedTicket = null;

  function showResult(title, message, icon = "ℹ") {
    result.classList.remove("hidden");
    resultIcon.textContent = icon;
    resultTitle.textContent = title;
    resultMessage.textContent = message;
  }

  function sendRequest(type, payload = {}) {
    return new Promise((resolve, reject) => {
      if (!bridgeReady || !bridge.contentWindow) {
        reject(new Error("The scanner connection is not ready."));
        return;
      }

      if (pendingRequest) {
        reject(new Error("Please wait for the current request."));
        return;
      }

      const requestId = String(++requestCounter);

      const timer = setTimeout(() => {
        pendingRequest = null;
        reject(new Error("The server did not respond. Please try again."));
      }, 20000);

      pendingRequest = {
        requestId,
        resolve,
        reject,
        timer
      };

      bridge.contentWindow.postMessage({
        channel: CHANNEL,
        requestId,
        type,
        ...payload
      }, "*");
    });
  }

  window.addEventListener("message", function(event) {
    if (!bridge || event.source !== bridge.contentWindow) return;

    const data = event.data;
    if (!data || data.channel !== CHANNEL) return;

    if (data.type === "BRIDGE_READY") {
      bridgeReady = true;
      return;
    }

    if (!pendingRequest ||
        data.requestId !== pendingRequest.requestId) return;

    clearTimeout(pendingRequest.timer);

    const request = pendingRequest;
    pendingRequest = null;
    request.resolve(data.result);
  });

  function getSavedSession() {
    try {
      return sessionStorage.getItem("SOTF_SESSION_TOKEN") || "";
    } catch (e) {
      return "";
    }
  }

  function saveSession(token) {
    try {
      if (token) {
        sessionStorage.setItem("SOTF_SESSION_TOKEN", token);
      }
    } catch (e) {}
  }

  async function verifyTicket(ticketId) {
    verifiedTicket = null;

    showResult("VERIFYING TICKET",
      "Checking the ticket against the official ticket records...", "⌛");

    try {
      const response = await sendRequest("VERIFY", { ticketId });

      if (!response || typeof response !== "object") {
        throw new Error("The server returned an invalid response.");
      }

      if (response.ok && response.status === "VALID TICKET") {
        verifiedTicket = ticketId;

        showResult(
          "VALID TICKET",
          "Guest: " + (response.guestName || "Name unavailable") +
          ". Confirm the guest, then proceed to check-in.",
          "✓"
        );

        // Add the check-in button dynamically if needed.
        let checkinButton = document.getElementById("checkinButton");

        if (!checkinButton) {
          checkinButton = document.createElement("button");
          checkinButton.id = "checkinButton";
          checkinButton.type = "button";
          checkinButton.textContent = "CHECK IN GUEST";
          checkinButton.style.cssText =
            "width:100%;margin-top:16px;padding:16px;" +
            "border:0;border-radius:12px;font-weight:bold;" +
            "cursor:pointer;";
          result.appendChild(checkinButton);
        }

        checkinButton.onclick = () => checkInTicket(ticketId);
        checkinButton.classList.remove("hidden");
      } else {
        const checkinButton = document.getElementById("checkinButton");
        if (checkinButton) checkinButton.classList.add("hidden");

        showResult(
          response.status || "VERIFICATION FAILED",
          response.message || "This ticket could not be verified.",
          "!"
        );
      }
    } catch (error) {
      showResult("CONNECTION ERROR", error.message, "!");
    }
  }

  async function checkInTicket(ticketId) {
    if (verifiedTicket !== ticketId) {
      showResult("VERIFY TICKET FIRST",
        "Verify this ticket again before check-in.", "!");
      return;
    }

    const savedToken = getSavedSession();
    let pin = "";

    if (!savedToken) {
      pin = window.prompt("Enter the staff PIN to check in this guest.") || "";

      if (!pin.trim()) {
        showResult("PIN REQUIRED",
          "Staff authorization is required for check-in.", "!");
        return;
      }
    }

    const checkinButton = document.getElementById("checkinButton");
    if (checkinButton) checkinButton.disabled = true;

    showResult("PROCESSING CHECK-IN",
      "Confirming authorization and updating the ticket record...", "⌛");

    try {
      const response = await sendRequest("CHECK_IN", {
        ticketId,
        pin,
        sessionToken: savedToken
      });

      if (response && response.sessionToken) {
        saveSession(response.sessionToken);
      }

      if (response && response.ok &&
          response.status === "CHECK-IN SUCCESSFUL") {
        verifiedTicket = null;

        showResult(
          "CHECK-IN SUCCESSFUL",
          "Guest: " + (response.guestName || "Name unavailable") +
          ". The ticket has been marked as used.",
          "✓"
        );

        if (checkinButton) checkinButton.classList.add("hidden");
      } else {
        if (response && response.status === "PIN REQUIRED") {
          try {
            sessionStorage.removeItem("SOTF_SESSION_TOKEN");
          } catch (e) {}
        }

        showResult(
          response && response.status || "CHECK-IN FAILED",
          response && response.message || "The guest was not checked in.",
          "!"
        );

        if (checkinButton) checkinButton.classList.remove("hidden");
      }
    } catch (error) {
      showResult("CONNECTION ERROR", error.message, "!");
      if (checkinButton) checkinButton.classList.remove("hidden");
    } finally {
      if (checkinButton) checkinButton.disabled = false;
    }
  }

  const params = new URLSearchParams(window.location.search);
  const ticketFromUrl = params.get("ticket");

  if (ticketFromUrl) {
    ticketInput.value = ticketFromUrl.trim();
  }

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const ticketId = ticketInput.value.trim();

    if (!ticketId) {
      showResult("TICKET ID REQUIRED",
        "Enter a ticket ID to continue.", "!");
      return;
    }

    verifyTicket(ticketId);
  });

bridge.addEventListener("load", function() {
  if (!bridge.contentWindow) {
    showResult(
      "CONNECTION ERROR",
      "The scanner bridge could not be opened.",
      "!"
    );
    return;
  }

  bridge.contentWindow.postMessage({
    channel: CHANNEL,
    type: "PING",
    requestId: "bridge-check"
  }, "*");
});
</script>


  


</body>
</html>
