
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOTF Ticket Scanner</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #101b1c;
      --panel: #192627;
      --gold: #e6c779;
      --text: #f7f4eb;
      --muted: #aebbb8;
      --border: #354344;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #263b35 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .scanner {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(25, 38, 39, 0.96);
      box-shadow: 0 20px 60px #0005;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 30px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--border);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #465657;
      border-radius: 10px;
      outline: none;
      background: #101b1c;
      color: var(--text);
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #e6c77920;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #17201c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #101b1c;
    }

    #reader video {
      border-radius: 10px;
    }

    .camera-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .result-icon {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .result-title {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status-valid .result-title {
      color: #86efac;
    }

    .status-invalid .result-title,
    .status-used .result-title {
      color: #fca5a5;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="scanner">

    <header class="brand">
      <div class="logo">✦</div>
      <div class="eyebrow">SONG OF THE FIREFLIES</div>
      <h1>Ticket Scanner</h1>
      <p class="subtitle">
        Local demo · No Google Sheets or Apps Script connection
      </p>
    </header>

    <iframe
  id="scannerBridge"
  title="SOTF Apps Script connection"
  hidden
  aria-hidden="true"
></iframe>



    <div class="divider"></div>

    <!-- Camera scanner -->
    <div id="reader" class="hidden"></div>

    <button id="startCamera" type="button">
      OPEN CAMERA
    </button>

    <button id="stopCamera" class="secondary hidden" type="button">
      STOP CAMERA
    </button>

    <p id="cameraNote" class="camera-note">
      Allow camera access when prompted. Camera access requires HTTPS or localhost.
    </p>

    <div class="divider"></div>

    <!-- Manual testing -->
    <label for="ticketInput">
      Or enter a ticket ID / paste QR content
    </label>

    <input
      id="ticketInput"
      type="text"
      placeholder="SOTF-TEST001-T01"
      autocomplete="off"
    >

    
<label for="staffPin">Staff PIN</label>
<input
  id="staffPin"
  type="password"
  placeholder="Enter staff PIN"
  autocomplete="current-password"
>


    <button id="verifyButton" type="button">
      VERIFY TICKET
    </button>

    <button id="checkInButton" class="hidden" type="button">
      CHECK IN
    </button>

    <!-- Result -->
    <section id="result" class="result hidden" aria-live="polite">
      <div id="resultIcon" class="result-icon">ℹ</div>
      <div id="resultTitle" class="result-title">READY</div>
      <div id="resultMessage" class="result-message"></div>
    </section>

    <footer class="footer">
      LOCAL TEST MODE<br>
      Sample tickets only. Nothing is saved to your spreadsheet.
    </footer>

  </main>

 

<script>
  // ==========================================
  // SOTF APPS SCRIPT CONNECTION
  // ==========================================

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbwghjiVJQgtgq2-lRcpShSEtWZXJQor5Rzh4wN_n3p7wPoDye5kmFBQvyyGZyGndu_H/exec";

  const bridge = document.getElementById("scannerBridge");
    bridge.src = WEB_APP_URL + "?bridge=1";

  const CHANNEL = "SOTF_SCANNER";
  const REQUEST_TIMEOUT = 20000;

  const ticketInput = document.getElementById("ticketInput");
  const verifyButton = document.getElementById("verifyButton");
  const checkInButton = document.getElementById("checkInButton");
  const startCameraButton = document.getElementById("startCamera");
  const stopCameraButton = document.getElementById("stopCamera");
  const reader = document.getElementById("reader");
  const result = document.getElementById("result");
  const resultIcon = document.getElementById("resultIcon");
  const resultTitle = document.getElementById("resultTitle");
  const resultMessage = document.getElementById("resultMessage");
  const cameraNote = document.getElementById("cameraNote");
  const bridgeFrame = document.getElementById("scannerBridge");
  const staffPin = document.getElementById("staffPin");

  let currentTicketId = "";
  let currentGuest = "";
  let sessionToken = "";
  let qrScanner = null;
  let cameraRunning = false;
  let handlingScan = false;
  let bridgeReady = false;
  let requestCounter = 0;
  const pendingRequests = new Map();

  // ==========================================
  // READ TICKET ID FROM QR CONTENT
  // ==========================================

  function extractTicketId(rawText) {
    const value = String(rawText || "").trim();

    if (!value) return "";

    try {
      const url = new URL(value);
      const ticket = url.searchParams.get("ticket");

      if (ticket) return ticket.trim();
    } catch (error) {
      // The QR content may be a plain ticket ID.
    }

    const match = value.match(/SOTF-[A-Z0-9-]+/i);
    return match ? match[0].trim() : value;
  }

  // ==========================================
  // DISPLAY RESULT
  // ==========================================

  function showResult(type, title, message) {
    result.className = "result";

    if (type) result.classList.add(type);

    if (type === "status-valid") {
      resultIcon.textContent = "✓";
    } else if (
      type === "status-used" ||
      type === "status-invalid"
    ) {
      resultIcon.textContent = "⚠";
    } else {
      resultIcon.textContent = "ℹ";
    }

    resultTitle.textContent = title;
    resultMessage.textContent = message;
    result.classList.remove("hidden");
  }

  // ==========================================
  // CONNECT TO SCANNER BRIDGE
  // ==========================================

  function connectBridge() {
    bridgeReady = false;
    cameraNote.textContent = "Connecting to the SOTF ticket system…";

    bridgeFrame.src = WEB_APP_URL + "?bridge=1";
  }

  function sendBridgeRequest(type, payload = {}) {
    return new Promise((resolve, reject) => {
      if (!bridgeReady || !bridgeFrame.contentWindow) {
        reject(new Error(
          "Scanner bridge is not ready. Reload the page and try again."
        ));
        return;
      }

      const requestId =
        Date.now().toString(36) + "-" + (++requestCounter);

      const timeout = setTimeout(() => {
        pendingRequests.delete(requestId);
        reject(new Error(
          "Apps Script timed out. Check your deployment and connection."
        ));
      }, REQUEST_TIMEOUT);

      pendingRequests.set(requestId, {
        resolve,
        reject,
        timeout
      });

      bridgeFrame.contentWindow.postMessage({
        channel: CHANNEL,
        type,
        requestId,
        ...payload
      }, "*");
    });
  }

  window.addEventListener("message", function(event) {
    if (event.source !== bridgeFrame.contentWindow) return;

    const data = event.data;

    if (!data || data.channel !== CHANNEL) return;

    if (data.type === "BRIDGE_READY") {
      bridgeReady = true;
      cameraNote.textContent = "Connected to the SOTF ticket system.";
      return;
    }

    if (!data.requestId) return;

    const pending = pendingRequests.get(data.requestId);
    if (!pending) return;

    clearTimeout(pending.timeout);
    pendingRequests.delete(data.requestId);
    pending.resolve(data.result);
  });

  // ==========================================
  // INTERPRET APPS SCRIPT RESPONSE
  // ==========================================

  function getStatus(response) {
    return String(
      response && (response.status || response.message) || "SYSTEM ERROR"
    ).trim().toUpperCase();
  }

  function getGuest(response) {
    return String(
      response && (
        response.guest ||
        response.name ||
        response.guestName
      ) || currentGuest || ""
    ).trim();
  }

  function getMessage(response) {
    const parts = [];
    const guest = getGuest(response);

    if (response && response.message) {
      parts.push(String(response.message));
    }

    if (guest) parts.push("Guest: " + guest);

    if (currentTicketId) {
      parts.push("Ticket: " + currentTicketId);
    }

    return parts.join(" · ") || getStatus(response);
  }

  function displayServerResult(response, action) {
    const status = getStatus(response);

    if (!response) {
      showResult(
        "status-invalid",
        "NO SERVER RESPONSE",
        "Apps Script returned an empty response."
      );
      checkInButton.classList.add("hidden");
      return;
    }

    if (
      response.sessionToken &&
      (
        status.includes("SUCCESS") ||
        status === "VALID TICKET"
      )
    ) {
      sessionToken = response.sessionToken;
    }

    if (
      status === "VALID TICKET" ||
      status === "VALID"
    ) {
      currentGuest = getGuest(response);

      showResult(
        "status-valid",
        "VALID TICKET",
        getMessage(response) + ". Confirm the guest before checking in."
      );

      checkInButton.classList.remove("hidden");
      return;
    }

    if (
      status.includes("CHECK-IN SUCCESSFUL") ||
      status.includes("CHECK IN SUCCESSFUL")
    ) {
      currentGuest = getGuest(response);

      showResult(
        "status-valid",
        "CHECK-IN SUCCESSFUL",
        getMessage(response) + ". The server confirmed the check-in."
      );

      checkInButton.classList.add("hidden");
      staffPin.value = "";
      return;
    }

    if (
      status.includes("ALREADY USED") ||
      status.includes("ALREADY CHECKED") ||
      status.includes("REVOKED")
    ) {
      showResult("status-used", status, getMessage(response));
      checkInButton.classList.add("hidden");
      return;
    }

    showResult(
      "status-invalid",
      status,
      getMessage(response)
    );

    // Allow retry after a PIN error, but not for an invalid ticket.
    if (
      action === "checkin" &&
      (
        status.includes("PIN REQUIRED") ||
        status.includes("INCORRECT PIN") ||
        status.includes("UNAUTHORIZED")
      )
    ) {
      checkInButton.classList.remove("hidden");
    } else {
      checkInButton.classList.add("hidden");
    }
  }

  // ==========================================
  // VERIFY AGAINST GOOGLE SHEETS
  // ==========================================

  async function verifyTicket(rawValue) {
    const id = extractTicketId(rawValue);

    ticketInput.value = id;
    currentTicketId = id;
    currentGuest = "";

    checkInButton.classList.add("hidden");

    if (!id) {
      showResult(
        "status-invalid",
        "NO TICKET ID",
        "Scan a QR code or enter a ticket ID first."
      );
      return;
    }

    verifyButton.disabled = true;

    showResult(
      "",
      "VERIFYING…",
      "Checking the ticket against the SOTF spreadsheet."
    );

    try {
      const response = await sendBridgeRequest("VERIFY", {
        ticketId: id
      });

      displayServerResult(response, "verify");
    } catch (error) {
      showResult("status-invalid", "CONNECTION ERROR", error.message);
    } finally {
      verifyButton.disabled = false;
    }
  }

  verifyButton.addEventListener("click", function() {
    verifyTicket(ticketInput.value);
  });

  ticketInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      verifyTicket(ticketInput.value);
    }
  });

  // ==========================================
  // CHECK IN THROUGH APPS SCRIPT
  // ==========================================

  checkInButton.addEventListener("click", async function() {
    if (!currentTicketId) return;

    checkInButton.disabled = true;

    try {
      const response = await sendBridgeRequest("CHECK_IN", {
        ticketId: currentTicketId,
        pin: staffPin ? staffPin.value.trim() : "",
        sessionToken: sessionToken
      });

      displayServerResult(response, "checkin");
    } catch (error) {
      showResult("status-invalid", "CONNECTION ERROR", error.message);
    } finally {
      checkInButton.disabled = false;
    }
  });

  // ==========================================
  // CAMERA QR SCANNER
  // ==========================================

  async function startCamera() {
    if (!window.Html5Qrcode) {
      cameraNote.textContent =
        "The QR scanner library did not load. Check your internet connection and reload.";
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      cameraNote.textContent =
        "Camera access requires HTTPS or localhost.";
      return;
    }

    if (!bridgeReady) {
      cameraNote.textContent =
        "The SOTF system is not connected yet. Please wait and try again.";
      return;
    }

    startCameraButton.disabled = true;
    cameraNote.textContent = "Requesting camera permission…";
    reader.classList.remove("hidden");

    try {
      if (!qrScanner) {
        qrScanner = new Html5Qrcode("reader");
      }

      await qrScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 240, height: 240 },
          aspectRatio: 1.0
        },
        async function(decodedText) {
          if (handlingScan) return;

          handlingScan = true;

          try {
            await stopCamera();
            await verifyTicket(decodedText);

            cameraNote.textContent =
              "QR code detected. Press OPEN CAMERA to scan another ticket.";
          } finally {
            handlingScan = false;
          }
        },
        function() {
          // Ignore frames without a QR code.
        }
      );

      cameraRunning = true;
      startCameraButton.classList.add("hidden");
      stopCameraButton.classList.remove("hidden");

      cameraNote.textContent =
        "Point the camera at the ticket QR code.";
    } catch (error) {
      reader.classList.add("hidden");
      startCameraButton.disabled = false;

      cameraNote.textContent =
        "Could not open the camera. Allow camera permission and use HTTPS or localhost. " +
        (error && error.message ? error.message : "");
    }
  }

  async function stopCamera() {
    if (qrScanner && cameraRunning) {
      try {
        await qrScanner.stop();
      } catch (error) {
        // Ignore camera stop errors.
      }

      cameraRunning = false;
    }

    startCameraButton.classList.remove("hidden");
    startCameraButton.disabled = false;
    stopCameraButton.classList.add("hidden");
    reader.classList.add("hidden");
  }

  startCameraButton.addEventListener("click", startCamera);
  stopCameraButton.addEventListener("click", stopCamera);

  // Connect when the page loads.
  connectBridge();
</script>


</body>
</html>
